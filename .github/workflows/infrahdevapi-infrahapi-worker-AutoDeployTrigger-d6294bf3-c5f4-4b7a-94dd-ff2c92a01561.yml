name: Trigger auto deployment for infrahdevapi-infrahapi-worker

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ infrah-must-api-final ]
    paths:
    - '**'
    - '.github/workflows/infrahdevapi-infrahapi-worker-AutoDeployTrigger-d6294bf3-c5f4-4b7a-94dd-ff2c92a01561.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.INFRAHDEVAPIINFRAHAPIWORKER_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: infrahdevapiinfrahapicontregistry.azurecr.io
          registryUsername: ${{ secrets.INFRAHDEVAPIINFRAHAPIWORKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INFRAHDEVAPIINFRAHAPIWORKER_REGISTRY_PASSWORD }}
          containerAppName: infrahdevapi-infrahapi-worker
          resourceGroup: MeruDevops
          imageToBuild: infrahdevapiinfrahapicontregistry.azurecr.io/infrahdevapi-infrahapi-worker:${{ github.sha }}
          
            

     

